name: CI

on: [push]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/action-setup-python@v4
      with:
        python-version: '3.10'

    - name: Run unit tests
      run: |
        python -m unittest test_geometric_lib.py